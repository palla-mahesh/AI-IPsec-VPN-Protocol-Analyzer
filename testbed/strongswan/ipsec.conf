# StrongSwan IPsec VPN Configuration
# Testbed Reference Configurations for Linux Hosts & Docker Containers

config setup
    charondebug="ike 2, knl 2, cfg 2, net 2, esp 2, dpy 2"
    uniqueids=yes

# Connection 1: Modern Secure Tunnel Mode (AES-256-GCM, DH Group 19, PFS)
conn secure-tunnel-ikev2
    keyexchange=ikev2
    type=tunnel
    left=192.168.10.1
    leftsubnet=10.10.0.0/16
    leftauth=psk
    right=192.168.20.1
    rightsubnet=10.20.0.0/16
    rightauth=psk
    # IKE SA: AES-256-GCM, PRF-HMAC-SHA384, DH Group 19 (ECP 256)
    ike=aes256gcm16-prfsha384-modp2048-ecp256!
    # Child ESP SA: AES-256-GCM, PFS Group 19
    esp=aes256gcm16-ecp256!
    lifetime=3600s
    ikelifetime=28800s
    dpdaction=restart
    auto=start

# Connection 2: Legacy Insecure Tunnel Mode (3DES, MD5, DH Group 2, No PFS)
conn legacy-vulnerable-ikev1
    keyexchange=ikev1
    type=tunnel
    left=192.168.10.1
    leftsubnet=10.10.0.0/16
    leftauth=psk
    right=192.168.20.1
    rightsubnet=10.20.0.0/16
    rightauth=psk
    # IKE SA: 3DES, MD5, DH Group 2 (1024-bit MODP)
    ike=3des-md5-modp1024!
    # Child ESP SA: 3DES, MD5, No PFS
    esp=3des-md5!
    lifetime=86400s
    auto=add

# Connection 3: Transport Mode VoIP (AES-128-CBC + HMAC-SHA256, DH Group 14)
conn voip-transport-ikev2
    keyexchange=ikev2
    type=transport
    left=192.168.10.1
    leftauth=psk
    right=192.168.20.1
    rightauth=psk
    ike=aes128-sha256-modp2048!
    esp=aes128-sha256-modp2048!
    auto=add
